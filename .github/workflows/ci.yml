name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12', '13']
        include:
          - laravel: '11'
            testbench: '^9.18'
          - laravel: '12'
            testbench: '^10.12'
          - laravel: '13'
            testbench: '^11.3'
        exclude:
          - php: '8.2' # laravel/framework 13 requires PHP ^8.3
            laravel: '13'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, mbstring
          ini-values: zend.assertions=1, assert.exception=1
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Legacy self-check scripts
        run: for f in tests/*_check.php; do echo "::group::$f"; php "$f" || exit 1; echo "::endgroup::"; done
        env:
          OBSERVERA_LARAVEL_AUTOLOAD: vendor/autoload.php

  phpstan:
    name: PHPStan (PHP 8.4 / Laravel 13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^13.0" "orchestra/testbench:^11.3" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
